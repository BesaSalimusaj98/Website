server {
    listen 80;
    server_name stazhlink.com www.stazhlink.com;

    # Redirect HTTP to HTTPS
    return 301 https://stazhlink.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.stazhlink.com;

    ssl_certificate     /etc/letsencrypt/live/stazhlink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stazhlink.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to non-www
    return 301 https://stazhlink.com$request_uri;
}

server {
    listen 443 ssl;
    server_name stazhlink.com;

    ssl_certificate     /etc/letsencrypt/live/stazhlink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stazhlink.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/stazhlink-website;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache public files (logo, favicon, etc.)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # React Router — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
