services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: stazhlink_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./marketing-dist:/usr/share/nginx/html/marketing:ro
    depends_on:
      - frontend
      - backend
    networks:
      - stazhlink_network

  # PostgreSQL Database
  db:
    image: postgres:17
    container_name: stazhlink_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: stazhlink_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stazhlink_network

  # Database Admin Interface
  adminer:
    image: adminer
    container_name: stazhlink_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - stazhlink_network

  # Backend API
  backend:
    image: stazhlink-api:latest
    container_name: stazhlink_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: stazhlink_db
      DB_USER: postgres
      DB_PASSWORD: example
      FRONTEND_URL: https://app.stazhlink.com
      ACCESS_TOKEN_SECRET: 222bfdf5fae4707ab8ca9efe1ef79f51c81f05eed6c099b0c9d59fd27c360eb9e4c406d1c01f853e80cd0542f1c1eeb3ed2fc383a1345924b04569fc2e97c51c
      REFRESH_TOKEN_SECRET: 75ccb3e0b78cf320286cc42b98045ad6d9b6f28a1acbc68dd72544a91d8e0b868d3d549388e6cd343190f00281d44a5542c89af5a04e21a2c140a146f7c45182
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      CLOUDINARY_CLOUD_NAME: dnytu7s8y
      CLOUDINARY_API_KEY: 723631119522939
      CLOUDINARY_API_SECRET: D-YL5auYDHdYGJOW6Ma5d8cx_7k
    depends_on:
      - db
    networks:
      - stazhlink_network

  # Frontend Application
  frontend:
    image: stazhlink-app:latest
    container_name: stazhlink_frontend
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: https://api.stazhlink.com
    depends_on:
      - backend
    networks:
      - stazhlink_network

volumes:
  postgres_data:

networks:
  stazhlink_network:
    driver: bridge
