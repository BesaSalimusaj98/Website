events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=5r/s;

    # Max upload size (for voice/file uploads)
    client_max_body_size 20M;

    # Upstream definitions
    upstream frontend {
        server stazhlink_frontend:5173;
    }

    upstream backend {
        server stazhlink_backend:5000;
    }

    upstream zanamath_frontend {
        server 172.17.0.1:3001;
    }

    upstream zanamath_backend {
        server 172.17.0.1:8001;
    }

    upstream notary_frontend {
        server 172.17.0.1:3002;
    }

    upstream notary_backend {
        server 172.17.0.1:8002;
    }

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────

    server {
        listen 80;
        server_name stazhlink.com www.stazhlink.com app.stazhlink.com api.stazhlink.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 80;
        server_name zanamathai.com www.zanamathai.com api.zanamathai.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 80;
        server_name notary-copilot.com www.notary-copilot.com api.notary-copilot.com;
        return 301 https://$server_name$request_uri;
    }

    # ── Marketing Website — stazhlink.com (static Vite build) ───────────────

    # Redirect www → non-www
    server {
        listen 443 ssl;
        server_name www.stazhlink.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://stazhlink.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name stazhlink.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html/marketing;
        index index.html;

        # Cache hashed Vite assets forever
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache public static files
        location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            expires 6M;
            add_header Cache-Control "public";
            access_log off;
        }

        # React Router — all routes fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── StazhLink App — app.stazhlink.com ───────────────────────────────────

    server {
        listen 443 ssl;
        server_name app.stazhlink.com;

        ssl_certificate /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=web burst=20 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "https://app.stazhlink.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://app.stazhlink.com";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # ── StazhLink Backend API — api.stazhlink.com ───────────────────────────

    server {
        listen 443 ssl;
        server_name api.stazhlink.com;

        ssl_certificate /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "https://app.stazhlink.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://app.stazhlink.com";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # ── ZanaMath Frontend — zanamathai.com ──────────────────────────────────

    server {
        listen 443 ssl;
        server_name zanamathai.com www.zanamathai.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://zanamath_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            proxy_pass http://zanamath_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── ZanaMath Backend API — api.zanamathai.com ───────────────────────────

    server {
        listen 443 ssl;
        server_name api.zanamathai.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://zanamath_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "https://zanamathai.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://zanamathai.com";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # ── Notary Copilot Frontend — notary-copilot.com ────────────────────────

    server {
        listen 443 ssl;
        server_name notary-copilot.com www.notary-copilot.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://notary_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 50M;
        }

        location / {
            proxy_pass http://notary_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Notary Copilot Backend API — api.notary-copilot.com ─────────────────

    server {
        listen 443 ssl;
        server_name api.notary-copilot.com;

        ssl_certificate     /etc/nginx/ssl/stazhlink.crt;
        ssl_certificate_key /etc/nginx/ssl/stazhlink.key;
